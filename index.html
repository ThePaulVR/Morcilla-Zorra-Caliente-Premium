<style>
/* Layout: sticky bar with logo, search and upload; sort chips; responsive video grid; watch dialog with up-next list. Blue and white like the TuTubo play icon. */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#e8ecf7; --line:#d6dcee;
  --fg:#141a33; --muted:#59627f; --accent:#2b44c6; --accent-fg:#ffffff; --hot:#d97706;
  --shadow:0 1px 2px rgba(20,26,51,.08),0 8px 24px rgba(20,26,51,.06);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1224; --surface:#171c35; --surface-2:#222947; --line:#2e3659;
  --fg:#eef1fc; --muted:#9aa3c7; --accent:#6f87ff; --accent-fg:#0b1030; --hot:#f6ad3b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1224; --surface:#171c35; --surface-2:#222947; --line:#2e3659;
  --fg:#eef1fc; --muted:#9aa3c7; --accent:#6f87ff; --accent-fg:#0b1030; --hot:#f6ad3b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1200px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font:800 22px var(--f-display);letter-spacing:-.02em;margin-right:auto}
.logo img{width:34px;height:34px;border-radius:8px;display:block}
.search{flex:1 1 280px;max-width:560px;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:0 16px;height:42px;order:2}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:500 16px var(--f-body);outline:0;height:100%}
.search input::placeholder{color:var(--muted)}
.search svg{color:var(--muted);flex:none}
.upload{background:var(--accent);color:var(--accent-fg);border:0;border-radius:99px;height:42px;padding:0 18px;font:700 14px var(--f-body);order:3;display:flex;align-items:center;gap:8px}
.upload:hover{filter:brightness(1.08)}
.theme{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;order:4}
.acct{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:99px;height:42px;padding:0 16px 0 6px;font:700 14px var(--f-body);order:3;display:flex;align-items:center;gap:8px;max-width:200px}
.acct .dot{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:800 14px var(--f-display);flex:none}
.acct span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct.out{padding:0 16px}
.acct .dot{overflow:hidden}.acct .dot img{width:100%;height:100%;object-fit:cover;display:block}
.bigav{width:96px;height:96px;font-size:36px;margin:0 auto}
.photo-row{display:flex;align-items:center;gap:12px}
.photo-row .av{width:56px;height:56px;font-size:22px}
.acct:hover{border-color:var(--accent)}
@media (max-width:700px){.search{order:5;flex:1 1 100%;max-width:none}}

.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-block:20px 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font:600 13px var(--f-body);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chan-filter{display:flex;align-items:center;gap:6px;font:600 13px var(--f-body);background:var(--surface-2);border-radius:99px;padding:6px 6px 6px 14px}
.chan-filter button{border:0;background:var(--fg);color:var(--bg);width:22px;height:22px;border-radius:50%;line-height:1;font-size:14px}
.count{margin-left:auto;font:500 13px var(--f-body);color:var(--muted)}

.grid{display:grid;gap:22px 16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{display:flex;flex-direction:column;gap:10px;min-width:0;background:none;border:0;padding:0;text-align:left}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:hsl(var(--h) 55% 38%);display:grid;place-items:center;color:#fff;transition:transform .15s}
.card:hover .thumb{transform:scale(1.015)}
.thumb .big{font:800 clamp(34px,6vw,54px) var(--f-display);opacity:.28;letter-spacing:-.04em;user-select:none}
.thumb .play{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;opacity:0;transition:opacity .15s}
.card:hover .play,.card:focus-visible .play{opacity:1}
.thumb .new{position:absolute;left:8px;top:8px;background:var(--hot);color:#1d1200;font:800 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:5px}
.thumb.local{background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb video{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:10px;min-width:0}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 15px var(--f-display);color:#fff;background:hsl(var(--h) 45% 42%)}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.meta{min-width:0}
.title{font:600 15px/1.3 var(--f-body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.sub .ch{background:none;border:0;padding:0;color:inherit;font:inherit}
.sub .ch:hover{color:var(--fg);text-decoration:underline}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font:800 20px var(--f-display);margin-bottom:4px}

dialog{border:0;padding:0;background:var(--surface);color:var(--fg);border-radius:16px;box-shadow:var(--shadow);width:min(960px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(5,8,20,.65)}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:0}
.stage{padding:16px;min-width:0}
.player{aspect-ratio:16/9;border-radius:12px;background:#05070f;overflow:hidden;display:grid;place-items:center;color:#c9d0f0;text-align:center;padding:16px}
.player video{width:100%;height:100%;display:block}
.player p{margin:0;max-width:34ch;font-size:14px}
.stage h2{font:800 20px/1.25 var(--f-display);margin:14px 0 6px;overflow-wrap:anywhere}
.side{border-left:1px solid var(--line);padding:16px;overflow:auto;max-height:70vh;min-width:0}
.side h3{margin:0 0 10px;font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.next{display:flex;gap:10px;width:100%;background:none;border:0;padding:6px 0;text-align:left;min-width:0}
.next .thumb{width:100px;flex:none;border-radius:8px}
.next .thumb .big{font-size:22px}
.close{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface-2);font-size:18px;line-height:1;z-index:2}
@media (max-width:760px){.watch{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line);max-height:none}}

.form{padding:22px;display:grid;gap:14px;min-width:0}
.form h2{margin:0;font:800 20px var(--f-display)}
.form label{display:grid;gap:6px;font:600 13px var(--f-body);color:var(--muted)}
.form input[type=text]{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:0 12px;font:500 16px var(--f-body)}
.form input[type=file]{font:500 14px var(--f-body);color:var(--fg);max-width:100%}
.form .hint{font-size:13px;color:var(--muted);margin:0}
.form input[type=password],.form input[readonly]{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:0 12px;font:500 16px var(--f-body)}
.form input[readonly]{background:var(--surface-2);color:var(--muted)}
.tabs{display:flex;gap:6px;background:var(--surface-2);border-radius:99px;padding:4px}
.tabs button{flex:1;border:0;background:none;border-radius:99px;height:34px;font:700 14px var(--f-body);color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.err{color:#c62828;font:600 13px var(--f-body);margin:0;min-height:1em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ff8a80}}
:root[data-theme="dark"] .err{color:#ff8a80}
.form .btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{border-radius:10px;height:40px;padding:0 18px;font:700 14px var(--f-body);border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font:600 14px var(--f-body);transition:.2s;pointer-events:none;z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cmts{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.cmts h3{margin:0 0 12px;font:700 16px var(--f-display)}
.cform{display:flex;gap:8px}
.cform input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--fg);padding:0 16px;font:500 15px var(--f-body)}
.cform input:focus{outline:0;border-color:var(--accent)}
.cform .btn{border-radius:99px;height:40px}
.cmts .hint{font-size:13px;color:var(--muted);margin:8px 0 0;min-height:1em}
.cm{display:flex;gap:10px;margin-top:14px;align-items:flex-start}
.cm .av{width:32px;height:32px;font-size:13px}
.cm .who{font:700 13px var(--f-body)}
.cm .when{color:var(--muted);font-weight:500;margin-left:8px;font-size:12px}
.cm .txt{overflow-wrap:anywhere;white-space:pre-wrap;font-size:15px}
.cm .del{border:0;background:none;color:var(--muted);font:600 12px var(--f-body);padding:2px 6px;flex:none}
.cm .del:hover{color:var(--fg)}
.nav{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto}
.nav button{border:0;background:none;padding:10px 18px;font:700 15px var(--f-body);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.form select{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:0 10px;font:500 16px var(--f-body)}
.feed{height:min(calc(100vh - 190px),780px);height:min(calc(100dvh - 190px),780px);min-height:360px;overflow-y:auto;scroll-snap-type:y mandatory;margin-top:12px;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.short{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;justify-content:center;align-items:center;padding:6px 0}
.sv{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;background:#000;border-radius:18px;overflow:hidden;cursor:pointer}
.sv video{width:100%;height:100%;object-fit:cover;display:block}
.sov{position:absolute;left:0;right:0;bottom:0;padding:48px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;pointer-events:none}
.sov .title{color:#fff;font:700 15px var(--f-body)}
.sov .sub{color:rgba(255,255,255,.8);font-size:13px}
.sside{align-self:flex-end;margin:0 0 20px 14px;display:flex;flex-direction:column;gap:12px}
.sbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--surface-2);color:var(--fg);display:grid;place-items:center}
.sbtn:hover{filter:brightness(1.1)}
@media (max-width:640px){.sside{position:absolute;right:12px;bottom:84px;margin:0}.sbtn{background:rgba(0,0,0,.55);color:#fff}}
.short.loading .sv::after,.short.fail .sv::after{content:"Cargando…";position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.45);font:600 14px var(--f-body)}
.short.fail .sv::after{content:"No se pudo cargar el short"}
.cview{max-width:680px;margin:18px auto 0}
.composer{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px}
.composer .av{width:40px;height:40px}
.pc{flex:1;min-width:0}
.pc textarea{width:100%;resize:vertical;min-height:56px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:10px 12px;font:500 15px var(--f-body)}
.pc textarea:focus{outline:0;border-color:var(--accent)}
.pprev img{max-width:100%;max-height:220px;border-radius:10px;display:block;margin-top:8px}
.pbtns{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:8px;flex-wrap:wrap}
label.btn{display:inline-flex;align-items:center;cursor:pointer}
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.phead{display:flex;gap:10px;align-items:center}
.phead .av{width:40px;height:40px}
.pwho b{font:700 14px var(--f-body)}
.pwho .when{color:var(--muted);margin-left:8px;font-size:12px}
.post .del{border:0;background:none;color:var(--muted);font:600 12px var(--f-body);padding:2px 6px;margin-left:auto}
.ptxt{margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.pimg{width:100%;max-height:480px;object-fit:contain;border-radius:10px;margin-top:10px;background:var(--bg);display:block}
.pact{display:flex;gap:8px;margin-top:12px}
.pact button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font:600 13px var(--f-body);color:var(--muted)}
.pact button.on{color:#e0245e;border-color:#e0245e}
.pact button.on2{background:var(--surface-2);color:var(--fg)}
.pcm{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  }else{var i=p.likes.indexOf(me);if(i>-1)p.likes.splice(i,1);else p.likes.push(me);renderComm()}
}
function delPost(p){
  if(!confirm("¿Borrar esta publicación?"))return;
  if(CLOUD)db.collection("posts").doc(p.id)["delete"]().catch(function(){toast("No se pudo borrar la publicación")});
  else{LP=LP.filter(function(x){return x.id!==p.id});renderComm()}
}
function commentRow(c,mine,onDel){
  var row=el("div","cm"),av=el("div","av",initial(c.c));av.style.setProperty("--h",hue(c.c));fillAv(av,c.c);
  var b=el("div");b.style.minWidth="0";b.style.flex="1";
  var who=el("div","who",c.c);who.appendChild(el("span","when",agoMs(c.ts)));
  b.appendChild(who);b.appendChild(el("div","txt",c.t));row.appendChild(av);row.appendChild(b);
  if(mine){var d=el("button","del","Borrar");d.type="button";d.onclick=onDel;row.appendChild(d)}
  return row;
}
function cbox(p){
  var w=el("div","pcm"),f=el("form","cform"),i=el("input");i.type="text";i.maxLength=500;i.placeholder="Añade un comentario…";
  i.value=cdraft[p.id]||"";i.addEventListener("input",function(){cdraft[p.id]=i.value});
  var b=el("button","btn primary","Comentar");b.type="submit";f.appendChild(i);f.appendChild(b);
  var hint=el("p","hint"),list=el("div");w.appendChild(f);w.appendChild(hint);w.appendChild(list);
  var items=[];
  function draw(){
    list.innerHTML="";hint.textContent=me?"":"Inicia sesión para comentar.";
    items.forEach(function(c){
      var mine=CLOUD?!!(auth&&auth.currentUser&&auth.currentUser.uid===c.uid):!!(me&&c.c===me);
      list.appendChild(commentRow(c,mine,function(){
        if(CLOUD)db.collection("posts").doc(p.id).collection("comments").doc(c.id)["delete"]().catch(function(){toast("No se pudo borrar el comentario")});
        else{LPC[p.id]=(LPC[p.id]||[]).filter(function(x){return x.id!==c.id});items=LPC[p.id].slice();draw()}
      }));
    });
  }
  if(CLOUD&&db){
    bunsubs.push(db.collection("posts").doc(p.id).collection("comments").orderBy("ts","desc").limit(100).onSnapshot(function(sn){
      items=[];sn.forEach(function(d){var o=d.data();items.push({id:d.id,uid:o.uid,c:o.channel,t:o.text,ts:o.ts})});draw();
    },function(){}));
  }else{items=(LPC[p.id]||[]).slice()}
  f.addEventListener("submit",function(e){
    e.preventDefault();var txt=i.value.trim();if(!txt)return;
    if(!me){toast("Inicia sesión para comentar");openAuth("in");return}
    b.disabled=true;var job;
    if(CLOUD)job=db.collection("posts").doc(p.id).collection("comments").add({uid:auth.currentUser.uid,channel:me,text:txt,ts:Date.now()});
    else{(LPC[p.id]=LPC[p.id]||[]).unshift({id:"l"+Date.now(),c:me,t:txt,ts:Date.now()});items=LPC[p.id].slice();draw();job=Promise.resolve()}
    job.then(function(){i.value="";cdraft[p.id]=""},function(er){toast(er&&er.code==="permission-denied"?"Sin permiso: faltan las reglas nuevas de Firestore":"No se pudo publicar el comentario")}).then(function(){b.disabled=false});
  });
  draw();
  return w;
}
function setPimg(d){pimg=d||"";$("#pprev").hidden=!d;if(d)$("#pimgel").src=d;else $("#pimgel").removeAttribute("src")}
$("#pfile").addEventListener("change",function(){
  var f=this.files[0];this.value="";if(!f)return;
  readImage(f,720).then(function(d){setPimg(d);$("#perr").textContent=""},function(er){$("#perr").textContent=er.message});
});
$("#pimgx").onclick=function(){setPimg("")};
$("#pform").addEventListener("submit",function(e){
  e.preventDefault();
  var txt=$("#ptext").value.trim();
  if(!txt&&!pimg){$("#perr").textContent="Escribe algo o añade una imagen.";return}
  if(!me){toast("Inicia sesión para publicar");openAuth("in");return}
  $("#perr").textContent="";var btn=$("#psend");btn.disabled=true;var job;
  if(CLOUD)job=db.collection("posts").add({uid:auth.currentUser.uid,channel:me,text:txt,img:pimg,ts:Date.now(),likedBy:[]});
  else{LP.unshift({id:"l"+Date.now(),uid:"",c:me,t:txt,img:pimg,ts:Date.now(),likes:[]});job=Promise.resolve()}
  job.then(function(){$("#ptext").value="";setPimg("");renderComm();toast("Publicado")},
    function(er){toast(er&&er.code==="permission-denied"?"Sin permiso: faltan las reglas nuevas de Firestore":"No se pudo publicar")}).then(function(){btn.disabled=false});
});

/* ---- operaciones (modo local o compartido) ---- */
function doRegister(name,pass,avatar){
  var k=ukey(name);
  if(!CLOUD){
    var users=getUsers();
    if(users[k])return Promise.reject(new Error("Ese nombre ya está en uso. Elige otro."));
    var salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
    return sha(salt+pass).then(function(h){
      var u2=getUsers();if(u2[k])throw new Error("Ese nombre ya está en uso. Elige otro.");
      u2[k]={name:name,salt:salt,hash:h,avatar:avatar||""};setUsers(u2);store("tt_session",k);me=name;
    });
  }
  return ready.then(function(){return keyH(name)}).then(function(h){
    regBusy=true;
    return auth.createUserWithEmailAndPassword(h+"@tutubo.users",pass).then(function(c){
      return db.collection("profiles").doc(h).set({name:name,uid:c.user.uid,avatar:avatar||""}).then(function(){
        me=name;meH=h;AVC[k]=avatar||"";
      },function(){
        return c.user["delete"]().catch(function(){}).then(function(){throw new Error("No se pudo crear la cuenta. Inténtalo de nuevo.")});
      });
    },function(er){throw authErr(er,true)});
  }).then(function(){regBusy=false},function(er){regBusy=false;throw er});
}
function doLogin(name,pass){
  var k=ukey(name);
  if(!CLOUD){
    var u=getUsers()[k];if(!u)return Promise.reject(new Error("Usuario o contraseña incorrectos."));
    return sha(u.salt+pass).then(function(h){
      if(h!==u.hash)throw new Error("Usuario o contraseña incorrectos.");
      store("tt_session",k);me=u.name;
    });
  }
  return ready.then(function(){return keyH(name)}).then(function(h){
    regBusy=true;
    return auth.signInWithEmailAndPassword(h+"@tutubo.users",pass).then(function(c){return loadProfile(c.user)},function(er){throw authErr(er,false)});
  }).then(function(){regBusy=false},function(er){regBusy=false;throw er});
}
function doLogout(){
  if(!CLOUD){store("tt_session","");me=null;return Promise.resolve()}
  return auth.signOut().then(function(){me=null});
}
function doSetAvatar(d){
  var k=ukey(me);
  if(!CLOUD){var u=getUsers();if(!u[k])return Promise.reject(new Error("Sin sesión."));u[k].avatar=d;setUsers(u);return Promise.resolve()}
  return db.collection("profiles").doc(meH).update({avatar:d}).then(function(){AVC[k]=d});
}

/* ---- interfaz ---- */
function refreshAcct(){
  if(!CLOUD)me=session();
  var b=$("#acct");b.textContent="";
  if(me){b.className="acct";var d=el("span","dot",initial(me));var src=avSrc(me);if(src){d.textContent="";var im=el("img");im.src=src;im.alt="";d.appendChild(im)}b.appendChild(d);b.appendChild(el("span","nm",me))}
  else{b.className="acct out";b.textContent="Iniciar sesión"}
  if(cur&&$("#watch").open)renderComments();
  if(tab==="comm")renderComm();
}
function setMode(m){
  mode=m;var up=m==="up";
  $("#tab-in").setAttribute("aria-selected",String(!up));$("#tab-up").setAttribute("aria-selected",String(up));
  $("#l-pass2").hidden=!up;$("#l-photo").hidden=!up;$("#atitle").textContent=up?"Crea tu cuenta":"Inicia sesión";
  $("#asubmit").textContent=up?"Crear cuenta":"Entrar";
  $("#a-pass").autocomplete=up?"new-password":"current-password";
  $("#ahint").hidden=!up;$("#aerr").textContent="";
}
function openAuth(m){setMode(m||"in");$("#authForm").reset();newPhoto="";paintAv($("#a-prev"),"?","");$("#aerr").textContent="";$("#authDlg").showModal();$("#a-user").focus()}
function fail(m){$("#aerr").textContent=m}
$("#tab-in").onclick=function(){setMode("in")};
$("#tab-up").onclick=function(){setMode("up")};
$("#a-photo").addEventListener("change",function(){
  var f=this.files[0];if(!f){newPhoto="";paintAv($("#a-prev"),$("#a-user").value||"?","");return}
  readPhoto(f).then(function(d){newPhoto=d;paintAv($("#a-prev"),"",d);$("#aerr").textContent=""},function(er){newPhoto="";$("#a-photo").value="";fail(er.message)});
});
$("#a-user").addEventListener("input",function(){if(!newPhoto)paintAv($("#a-prev"),this.value||"?","")});
$("#aclose").onclick=function(){$("#authDlg").close()};
$("#authDlg").addEventListener("click",function(e){if(e.target===this)this.close()});
$("#acct").onclick=function(){
  if(!me){openAuth("in");return}
  $("#accinfo").textContent="Has iniciado sesión como "+me+". Todo lo que subas saldrá en tu canal con este nombre.";
  paintAv($("#accav"),me,avSrc(me));$("#accDlg").showModal();
};
$("#chphoto").onclick=function(){$("#accfile").click()};
$("#accfile").addEventListener("change",function(){
  var f=this.files[0];this.value="";if(!f||!me)return;
  readPhoto(f).then(function(d){return doSetAvatar(d).then(function(){paintAv($("#accav"),me,d);refreshAcct();render();toast("Foto actualizada")})})
    .catch(function(er){toast(er.message||"No se pudo guardar la foto")});
});
$("#accclose").onclick=function(){$("#accDlg").close()};
$("#accDlg").addEventListener("click",function(e){if(e.target===this)this.close()});
$("#logout").onclick=function(){doLogout().then(function(){refreshAcct();render();$("#accDlg").close();toast("Sesión cerrada")})};
$("#mychan").onclick=function(){$("#accDlg").close();chan=me;term="";$("#q").value="";setTab("home");render();window.scrollTo(0,0)};
$("#authForm").addEventListener("submit",function(e){
  e.preventDefault();
  var name=$("#a-user").value.replace(/\s+/g," ").trim(),pass=$("#a-pass").value,k=ukey(name),up=mode==="up";
  if(!name)return fail("Escribe tu nombre de usuario.");
  if(!pass)return fail("Escribe tu contraseña.");
  if(up){
    if(name.length<3)return fail("El nombre debe tener al menos 3 caracteres.");
    if(!/^[A-Za-zÀ-ÿ0-9 ._\-]+$/.test(name))return fail("Solo letras, números, espacios, punto, guion y guion bajo.");
    if(pass.length<6)return fail("La contraseña debe tener al menos 6 caracteres.");
    if($("#a-pass2").value!==pass)return fail("Las contraseñas no coinciden.");
    if(VIDEOS.some(function(v){return ukey(v.c)===k}))return fail("Ese nombre ya pertenece a un canal existente.");
  }
  var btn=$("#asubmit");btn.disabled=true;$("#aerr").textContent="";
  (up?doRegister(name,pass,newPhoto):doLogin(name,pass)).then(function(){
    refreshAcct();render();$("#authDlg").close();toast(up?"Cuenta creada. Bienvenido, "+me:"Hola otra vez, "+me);
  },function(er){fail(er.message||"Algo salió mal. Inténtalo de nuevo.")}).then(function(){btn.disabled=false});
});
if(CLOUD){var hh=document.querySelector("#form .hint");if(hh)hh.textContent="Máximo 10 MB. Tu video lo podrá ver todo el mundo.";loadCloud()}
refreshAcct();
render();
</script>
